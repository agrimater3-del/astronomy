<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Milky Way Explorer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            color: #edf3ff;
            background: #02040b;
            font: 14px/1.5 system-ui, sans-serif;
        }

        canvas {
            display: block;
        }

        #panel {
            position: absolute;
            top: 16px;
            left: 16px;
            width: min(355px, calc(100vw - 32px));
            padding: 18px;
            background: rgba(8, 15, 30, .9);
            border: 1px solid #2b3d60;
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        h1 {
            font-size: 21px;
            margin: 0 0 5px;
        }

        p {
            margin: 8px 0;
        }

        .muted {
            color: #a7b8d6;
            font-size: 12px;
        }

        .buttons {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        button,
        select {
            color: #edf3ff;
            background: #152743;
            border: 1px solid #365581;
            border-radius: 8px;
            padding: 9px 12px;
            cursor: pointer;
        }

        button.active {
            background: #2856a6;
        }

        #solarUI {
            display: none;
            margin-top: 12px;
        }

        select {
            width: 100%;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type=range] {
            width: 100%;
        }

        #details {
            color: #d2e2ff;
            margin-top: 12px;
        }

        #footer {
            position: absolute;
            bottom: 12px;
            left: 16px;
            right: 16px;
            color: #a7b8d6;
            font-size: 12px;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
    <div id="panel">
        <h1>Milky Way Explorer</h1>
        <div class="muted">A galaxy, then our place within it.</div>

        <div class="buttons">
            <button id="galaxyButton" class="active">Milky Way</button>
            <button id="solarButton">Solar System</button>
            <button id="resetButton">Reset</button>
        </div>

        <p id="description"></p>

        <div id="solarUI">
            <select id="planetSelect">
                <option value="-1">Select a planet for information</option>
            </select>

            <label>
                Time: <span id="speedText">100</span> Earth days / second
                <input id="speed" type="range" min="0" max="1000" value="100">
            </label>

            <button id="pauseButton">Pause</button>
            <div id="details"></div>

            <p class="muted">
                Distances use a linear AU scale. Planet and Sun radii are enlarged;
                orbital elements are approximate, not an ephemeris.
            </p>
        </div>

        <p class="muted" id="scaleNote"></p>
    </div>

    <div id="footer">
        Drag: orbit · Scroll / pinch: zoom · Right-drag: pan
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ------------------------------------------------------------
        // Renderer and camera
        // ------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#02040b');

        const camera = new THREE.PerspectiveCamera(
            55, innerWidth / innerHeight, 0.01, 200000
        );

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;

        const galaxy = new THREE.Group();
        const solar = new THREE.Group();
        scene.add(galaxy, solar);

        const TAU = Math.PI * 2;
        const DEG = Math.PI / 180;
        const PC_TO_LY = 3.26156;

        // Seeded procedural generation.
        let seed = 14783;
        function random() {
            seed = (1664525 * seed + 1013904223) >>> 0;
            return seed / 4294967296;
        }
        function gaussian() {
            return Math.sqrt(-2 * Math.log(Math.max(random(), 1e-9))) *
                Math.cos(TAU * random());
        }

        function glowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(.15, 'rgba(255,255,255,.9)');
            g.addColorStop(.45, 'rgba(255,255,255,.25)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const glow = glowTexture();

        function pointCloud(parent, positions, colors, size, opacity = 1) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute(
                'position',
                new THREE.Float32BufferAttribute(positions, 3)
            );
            geometry.setAttribute(
                'color',
                new THREE.Float32BufferAttribute(colors, 3)
            );
            const material = new THREE.PointsMaterial({
                size,
                map: glow,
                vertexColors: true,
                transparent: true,
                opacity,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const points = new THREE.Points(geometry, material);
            parent.add(points);
            return points;
        }

        function label(text, position, width, parent, color = '#e8f2ff') {
            const canvas = document.createElement('canvas');
            canvas.width = 768;
            canvas.height = 96;
            const ctx = canvas.getContext('2d');
            ctx.font = '36px system-ui';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(3,8,18,.75)';
            ctx.fillRect(0, 0, 768, 96);
            ctx.fillStyle = color;
            ctx.fillText(text, 384, 48);

            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(canvas),
                transparent: true,
                depthTest: false
            }));
            sprite.position.copy(position);
            sprite.scale.set(width, width / 8, 1);
            parent.add(sprite);
            return sprite;
        }

        function marker(position, color, size, parent) {
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: glow,
                color,
                transparent: true,
                depthTest: false,
                blending: THREE.AdditiveBlending
            }));
            sprite.position.copy(position);
            sprite.scale.setScalar(size);
            parent.add(sprite);
            return sprite;
        }

        // ------------------------------------------------------------
        // Milky Way: coordinates in parsecs.
        // Illustrative four-arm pattern, not a measured star catalog.
        // ------------------------------------------------------------
        const starPositions = [];
        const starColors = [];
        const starColor = new THREE.Color();

        function addStar(x, y, z, population) {
            starPositions.push(x, y, z);
            const t = random();

            if (population === 'old') {
                starColor.setHSL(.075 + random() * .055, .4, .57 + random() * .3);
            } else if (t < .18) {
                starColor.setHSL(.60, .55, .75 + random() * .2);
            } else if (t < .58) {
                starColor.setHSL(.10, .25, .75 + random() * .2);
            } else {
                starColor.setHSL(.035, .5, .55 + random() * .3);
            }

            starColors.push(starColor.r, starColor.g, starColor.b);
        }

        const pitch = 13 * DEG;
        function armAngle(radius, arm) {
            return arm * TAU / 4 +
                Math.log(Math.max(radius, 1600) / 1600) / Math.tan(pitch);
        }

        // Disk: exponential radial density with an illustrative arm overdensity.
        for (let i = 0; i < 75000; i++) {
            let r;
            do {
                r = -2600 * Math.log(Math.max(random() * random(), 1e-12));
            } while (r > 15000);

            let theta = random() * TAU;

            if (r > 2800 && random() < .52) {
                theta = armAngle(r, Math.floor(random() * 4)) +
                    gaussian() * .085;
            }

            const thick = random() < .12;
            const y = gaussian() * (thick ? 750 : 180);
            addStar(r * Math.cos(theta), y, r * Math.sin(theta), 'disk');
        }

        // Central bulge: flattened older stellar population.
        for (let i = 0; i < 15000; i++) {
            addStar(
                gaussian() * 1150,
                gaussian() * 600,
                gaussian() * 1000,
                'old'
            );
        }

        // Stellar bar.
        const barAngle = 27 * DEG;
        for (let i = 0; i < 8000; i++) {
            const u = (random() * 2 - 1) * 4300;
            const v = gaussian() * 360;

            addStar(
                u * Math.cos(barAngle) - v * Math.sin(barAngle),
                gaussian() * 220,
                u * Math.sin(barAngle) + v * Math.cos(barAngle),
                'old'
            );
        }

        // Sparse inner stellar halo.
        for (let i = 0; i < 2000; i++) {
            const r = 3000 + Math.pow(random(), 1.7) * 22000;
            const cosTheta = random() * 2 - 1;
            const phi = random() * TAU;
            const s = Math.sqrt(1 - cosTheta * cosTheta);

            addStar(
                r * s * Math.cos(phi),
                r * cosTheta * .7,
                r * s * Math.sin(phi),
                'old'
            );
        }

        pointCloud(galaxy, starPositions, starColors, 27, .92);

        // Stylized ionized-gas / star-forming regions along the arms.
        const gasPositions = [];
        const gasColors = [];

        for (let i = 0; i < 3500; i++) {
            const r = 3500 + random() * 10000;
            const theta = armAngle(r, Math.floor(random() * 4)) +
                gaussian() * .045;

            gasPositions.push(
                r * Math.cos(theta),
                gaussian() * 90,
                r * Math.sin(theta)
            );

            const c = new THREE.Color().setHSL(
                random() < .6 ? .90 : .57, .7, .55
            );
            gasColors.push(c.r, c.g, c.b);
        }
        pointCloud(galaxy, gasPositions, gasColors, 180, .12);

        marker(new THREE.Vector3(0, 0, 0), '#ffcc89', 1500, galaxy);
        label(
            'Galactic center · Sagittarius A*',
            new THREE.Vector3(0, 1100, 0),
            5100,
            galaxy
        );

        // Galactic azimuth is chosen for visualization.
        const sunGalaxyPosition = new THREE.Vector3(8200, 20, 0);
        marker(sunGalaxyPosition, '#65dfff', 460, galaxy);
        label(
            'Sun · 8.2 kpc from center',
            new THREE.Vector3(8200, 650, 0),
            4300,
            galaxy,
            '#8be9ff'
        );

        // Reference circle at the Sun's galactocentric radius.
        const reference = [];
        for (let i = 0; i <= 256; i++) {
            const t = i / 256 * TAU;
            reference.push(new THREE.Vector3(
                8200 * Math.cos(t), 0, 8200 * Math.sin(t)
            ));
        }
        galaxy.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(reference),
            new THREE.LineBasicMaterial({
                color: '#327caa',
                transparent: true,
                opacity: .22
            })
        ));

        // ------------------------------------------------------------
        // Solar System: coordinates in AU.
        // a: semi-major axis, e: eccentricity, i: inclination,
        // node: longitude of ascending node,
        // peri: longitude of perihelion, period: Earth days.
        // Approximate J2000 elements; no perturbations/precession.
        // ------------------------------------------------------------
        const planets = [
            {
                name: 'Mercury', a: .3871, e: .2056, i: 7.005,
                node: 48.331, peri: 77.457, period: 87.969,
                radius: 2440, color: '#a5a09a', phase: .3
            },
            {
                name: 'Venus', a: .7233, e: .0068, i: 3.395,
                node: 76.680, peri: 131.602, period: 224.701,
                radius: 6052, color: '#dcb97d', phase: 2
            },
            {
                name: 'Earth', a: 1, e: .0167, i: 0,
                node: 0, peri: 102.937, period: 365.256,
                radius: 6371, color: '#468fdf', phase: 3
            },
            {
                name: 'Mars', a: 1.5237, e: .0934, i: 1.850,
                node: 49.558, peri: 336.041, period: 686.980,
                radius: 3390, color: '#cf6945', phase: 4
            },
            {
                name: 'Jupiter', a: 5.2029, e: .0484, i: 1.303,
                node: 100.464, peri: 14.754, period: 4332.59,
                radius: 69911, color: '#d2b295', phase: .8
            },
            {
                name: 'Saturn', a: 9.5367, e: .0539, i: 2.489,
                node: 113.665, peri: 92.432, period: 10759.22,
                radius: 58232, color: '#e3ce97', phase: 2.5
            },
            {
                name: 'Uranus', a: 19.189, e: .0473, i: .773,
                node: 74.006, peri: 170.964, period: 30688.5,
                radius: 25362, color: '#9bdddf', phase: 4.2
            },
            {
                name: 'Neptune', a: 30.0699, e: .0086, i: 1.770,
                node: 131.784, peri: 44.971, period: 60182,
                radius: 24622, color: '#456ee0', phase: 5.3
            }
        ];

        solar.add(new THREE.AmbientLight('#c0d5ff', .38));
        const sunlight = new THREE.PointLight('#fff3dd', 35, 0, 0);
        solar.add(sunlight);

        // Visible radii are symbolic, not proportional to orbital distances.
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(.13, 40, 24),
            new THREE.MeshBasicMaterial({ color: '#fff0a7' })
        );
        solar.add(sunMesh);
        marker(new THREE.Vector3(), '#ffb747', .65, solar);
        label('Sun', new THREE.Vector3(0, .38, 0), 1.1, solar);

        // Convert orbital-plane position into a Y-up 3D coordinate.
        function orbitalPosition(p, E) {
            const x = p.a * (Math.cos(E) - p.e);
            const y = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);

            const w = (p.peri - p.node) * DEG;
            const n = p.node * DEG;
            const inc = p.i * DEG;

            const u = x * Math.cos(w) - y * Math.sin(w);
            const v = x * Math.sin(w) + y * Math.cos(w);

            return new THREE.Vector3(
                u * Math.cos(n) - v * Math.cos(inc) * Math.sin(n),
                v * Math.sin(inc),
                u * Math.sin(n) + v * Math.cos(inc) * Math.cos(n)
            );
        }

        function eccentricAnomaly(M, e) {
            let E = M;
            for (let i = 0; i < 7; i++) {
                E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
            }
            return E;
        }

        for (const [index, p] of planets.entries()) {
            const orbit = [];
            for (let j = 0; j <= 256; j++) {
                orbit.push(orbitalPosition(p, j / 256 * TAU));
            }
            solar.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(orbit),
                new THREE.LineBasicMaterial({
                    color: '#49617c',
                    transparent: true,
                    opacity: .55
                })
            ));

            p.visualRadius = .035 + .16 * Math.sqrt(p.radius / 69911);
            p.mesh = new THREE.Mesh(
                new THREE.SphereGeometry(p.visualRadius, 32, 20),
                new THREE.MeshStandardMaterial({
                    color: p.color,
                    roughness: .9
                })
            );
            solar.add(p.mesh);

            p.label = label(p.name, new THREE.Vector3(), 1.3, solar);

            if (p.name === 'Saturn') {
                const rings = new THREE.Mesh(
                    new THREE.RingGeometry(
                        p.visualRadius * 1.25,
                        p.visualRadius * 2.35,
                        96
                    ),
                    new THREE.MeshStandardMaterial({
                        color: '#c6b48d',
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: .72,
                        roughness: 1
                    })
                );
                rings.rotation.x = -Math.PI / 2 + 26.7 * DEG;
                p.mesh.add(rings);
            }

            const option = document.createElement('option');
            option.value = index;
            option.textContent = p.name;
            document.querySelector('#planetSelect').appendChild(option);
        }

        // Belt particles are illustrative samples, not catalogued objects.
        // They are kept static; the planetary animation is the dynamical model.
        function belt(inner, outer, count, thickness, color, size) {
            const positions = [];
            const colors = [];
            const c = new THREE.Color(color);

            for (let i = 0; i < count; i++) {
                const r = Math.sqrt(
                    inner * inner + random() * (outer * outer - inner * inner)
                );
                const theta = random() * TAU;

                positions.push(
                    r * Math.cos(theta),
                    gaussian() * thickness,
                    r * Math.sin(theta)
                );
                colors.push(c.r, c.g, c.b);
            }

            pointCloud(solar, positions, colors, size, .55);
        }

        belt(2.1, 3.3, 3000, .08, '#ab9b84', .018);
        belt(30, 50, 4500, 1.2, '#718da6', .05);

        label(
            'Asteroid belt',
            new THREE.Vector3(-3.2, .35, 0),
            2,
            solar
        );
        label(
            'Kuiper belt · ~30–50 AU',
            new THREE.Vector3(-37, 2, 0),
            8,
            solar
        );

        // ------------------------------------------------------------
        // UI and view switching
        // ------------------------------------------------------------
        let mode = 'galaxy';
        let paused = false;
        let simulatedDays = 0;

        const galaxyButton = document.querySelector('#galaxyButton');
        const solarButton = document.querySelector('#solarButton');
        const description = document.querySelector('#description');
        const scaleNote = document.querySelector('#scaleNote');
        const solarUI = document.querySelector('#solarUI');
        const speedInput = document.querySelector('#speed');

        function resetCamera() {
            controls.target.set(0, 0, 0);

            if (mode === 'galaxy') {
                camera.near = 1;
                camera.far = 200000;
                camera.position.set(18000, 23000, 26000);
                controls.minDistance = 200;
                controls.maxDistance = 90000;
            } else {
                camera.near = .001;
                camera.far = 2000;
                camera.position.set(14, 31, 43);
                controls.minDistance = .25;
                controls.maxDistance = 180;
            }

            camera.updateProjectionMatrix();
            controls.update();
        }

        function setMode(next) {
            mode = next;
            galaxy.visible = mode === 'galaxy';
            solar.visible = mode === 'solar';

            galaxyButton.classList.toggle('active', galaxy.visible);
            solarButton.classList.toggle('active', solar.visible);
            solarUI.style.display = solar.visible ? 'block' : 'none';

            description.textContent = galaxy.visible
                ? 'Explore the stellar disk, spiral arms, central bar, bulge, and inner halo. The cyan marker identifies our Sun.'
                : 'Explore eight planets on elliptical, inclined orbits. Zoom in for the inner planets or out to the Kuiper belt.';

            scaleNote.textContent = galaxy.visible
                ? `Disk diameter shown: about ${Math.round(30000 * PC_TO_LY).toLocaleString()} light-years. Stars and nebulae are representative samples; arm geometry is illustrative.`
                : '1 AU ≈ 149.6 million km. Starting planet phases are illustrative, not positions on a specific date. Belt particles are static visual samples.';

            resetCamera();
        }

        galaxyButton.onclick = () => setMode('galaxy');
        solarButton.onclick = () => setMode('solar');
        document.querySelector('#resetButton').onclick = resetCamera;

        speedInput.oninput = () => {
            document.querySelector('#speedText').textContent = speedInput.value;
        };

        document.querySelector('#pauseButton').onclick = event => {
            paused = !paused;
            event.target.textContent = paused ? 'Resume' : 'Pause';
        };

        document.querySelector('#planetSelect').onchange = event => {
            const p = planets[Number(event.target.value)];
            document.querySelector('#details').innerHTML = p
                ? `<strong>${p.name}</strong><br>
       Mean orbital distance: ${p.a} AU<br>
       Orbital period: ${(p.period / 365.256).toFixed(3)} Earth years<br>
       Mean radius: ${p.radius.toLocaleString()} km<br>
       Eccentricity: ${p.e} · Inclination: ${p.i}°`
                : '';
        };

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        setMode('galaxy');

        const clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
            const dt = Math.min(clock.getDelta(), .1);

            if (mode === 'solar' && !paused) {
                simulatedDays += dt * Number(speedInput.value);
            }

            for (const p of planets) {
                const M = (p.phase + TAU * simulatedDays / p.period) % TAU;
                const E = eccentricAnomaly(M, p.e);
                p.mesh.position.copy(orbitalPosition(p, E));

                p.label.position.copy(p.mesh.position);
                p.label.position.y += p.visualRadius + .23;
            }

            controls.update();
            renderer.render(scene, camera);
        });
    </script>
</body>

</html>
